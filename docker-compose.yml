services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diamond_pay_backend
    restart: unless-stopped
    ports:
      - "5289:5289"
    env_file:
      - .env
    environment:
      - PORT=5289
      - NODE_ENV=production
    volumes:
      - ./uploads:/app/uploads
    networks:
      - diamond_network

networks:
  diamond_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.52.0/24
